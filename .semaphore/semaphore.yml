version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Teraform Init
    dependencies: []
    task:
      jobs:
        - name: Init
          commands:
            - cd 1-terraform-apply
            - terraform init
            - artifact push workflow .terraform
            - artifact push workflow .terraform.lock.hcl
      secrets:
        - name: localstack
  - name: Deploy
    dependencies:
      - Teraform Init
    task:
      jobs:
        - name: Fetch
          commands:
            - cd 1-terraform-apply
            - 'artifact pull workflow .terraform  '
            - artifact pull workflow .terraform.lock.hcl
            - chmod +x artifacts/workflows/*/.terraform
            - chmod +x artifacts/workflows/*/.terraform.lock.hcl
            - 'terraform validate  '
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate
      secrets:
        - name: localstack
