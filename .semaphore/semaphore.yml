version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Teraform Init
    dependencies: []
    task:
      jobs:
        - name: Init
          commands:
            - cd 1-terraform-apply
            - terraform init
            - artifact push workflow .terraform
            - artifact push workflow .terraform.lock.hcl
      secrets:
        - name: localstack
  - name: Deploy
    dependencies:
      - Teraform Init
    task:
      jobs:
        - name: Fetch
          commands:
            - cd 1-terraform-apply
            - 'artifact pull workflow .terraform  '
            - artifact pull workflow .terraform.lock.hcl
            - chmod -R +x .terraform
            - '#chmod +x artifacts/workflows/*/.terraform.lock.hcl'
            - 'terraform validate  '
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate
      secrets:
        - name: localstack
  - name: Use Bucket
    dependencies:
      - Deploy
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Bucket use
          commands:
            - cd 1-terraform-apply
            - '#alias aws="aws --endpoint-url=http://devops.tomfern.com:31566"'
            - 'aws s3 cp README.md s3://group2-bucket/'
            - 'aws s3 ls s3://group2-bucket'
            - 'aws s3 rm s3://group2-bucket/README.md'
  - name: Destroy
    dependencies:
      - Use Bucket
    task:
      jobs:
        - name: Destroy
          commands:
            - cd 1-terraform-apply
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - artifact pull workflow terraform.tfstate --force
            - terraform destroy
      secrets:
        - name: localstack
